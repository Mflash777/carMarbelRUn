<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="840" height="440" fill="#ffffff"/>
  <text x="20" y="32" font-size="20" font-weight="bold" fill="#222">Marble lift wiring</text>

  <rect x="20" y="70" width="120" height="50" rx="6" fill="#eeeeee" stroke="#555"/>
  <text x="80" y="100" text-anchor="middle">5 V charger</text>
  <rect x="180" y="70" width="140" height="50" rx="6" fill="#ffe9b3" stroke="#a77b00"/>
  <text x="250" y="92" text-anchor="middle">USB-C inline</text>
  <text x="250" y="110" text-anchor="middle">ON/OFF switch</text>
  <line x1="140" y1="95" x2="180" y2="95" stroke="#222" stroke-width="3"/>
  <line x1="320" y1="95" x2="370" y2="95" stroke="#222" stroke-width="3"/>

  <rect x="370" y="60" width="170" height="230" rx="8" fill="#d8ecff" stroke="#1f5fa8"/>
  <text x="455" y="85" text-anchor="middle" font-weight="bold">XIAO ESP32-C3</text>
  <g font-size="13">
    <text x="380" y="100">USB-C</text>
    <text x="530" y="120" text-anchor="end">5V</text>
    <text x="530" y="145" text-anchor="end">GND</text>
    <text x="530" y="170" text-anchor="end">D2</text>
    <text x="530" y="195" text-anchor="end">D3</text>
    <text x="530" y="220" text-anchor="end">D4</text>
    <text x="380" y="245">D1</text>
    <text x="380" y="270">A0</text>
  </g>

  <rect x="615" y="100" width="190" height="150" rx="8" fill="#e3f6e3" stroke="#2c7a2c"/>
  <text x="710" y="125" text-anchor="middle" font-weight="bold">DRV8833</text>
  <g font-size="13">
    <text x="625" y="150">VM (VCC)</text>
    <text x="625" y="172">GND</text>
    <text x="625" y="194">AIN1</text>
    <text x="625" y="216">AIN2</text>
    <text x="625" y="238">nSLEEP / EEP</text>
    <text x="795" y="150" text-anchor="end">AOUT1</text>
    <text x="795" y="172" text-anchor="end">AOUT2</text>
  </g>
  <polyline points="540,116 575,116 575,146 620,146" fill="none" stroke="#d00000" stroke-width="2.5"/>
  <polyline points="540,141 565,141 565,168 620,168" fill="none" stroke="#000000" stroke-width="2.5"/>
  <polyline points="540,166 555,166 555,190 620,190" fill="none" stroke="#00a060" stroke-width="2.5"/>
  <polyline points="540,191 548,191 548,212 620,212" fill="none" stroke="#0060c0" stroke-width="2.5"/>
  <polyline points="540,216 595,216 595,234 620,234" fill="none" stroke="#a000a0" stroke-width="2.5"/>

  <rect x="655" y="300" width="130" height="60" rx="8" fill="#f2f2f2" stroke="#555"/>
  <text x="720" y="327" text-anchor="middle" font-weight="bold">N20 motor</text>
  <text x="720" y="347" text-anchor="middle" font-size="12">6 V, 100 RPM</text>
  <polyline points="800,146 820,146 820,315 785,315" fill="none" stroke="#c06000" stroke-width="2.5"/>
  <polyline points="800,168 810,168 810,345 785,345" fill="none" stroke="#666666" stroke-width="2.5"/>

  <rect x="160" y="222" width="120" height="40" rx="6" fill="#fff4f4" stroke="#a33"/>
  <text x="220" y="247" text-anchor="middle">Push button</text>
  <line x1="370" y1="241" x2="280" y2="241" stroke="#a33" stroke-width="2.5"/>
  <line x1="160" y1="242" x2="120" y2="242" stroke="#000" stroke-width="2.5"/>
  <text x="62" y="247">GND</text>

  <rect x="160" y="300" width="120" height="50" rx="6" fill="#fff4f4" stroke="#a33"/>
  <text x="220" y="322" text-anchor="middle">10k pot</text>
  <text x="220" y="340" text-anchor="middle" font-size="12">ends to 3V3 and GND</text>
  <polyline points="370,266 330,266 330,325 280,325" fill="none" stroke="#a33" stroke-width="2.5"/>
  <text x="290" y="300" font-size="12" fill="#a33">wiper</text>

  <text x="20" y="410" font-size="12" fill="#555">Button: D1 to GND (internal pull-up). The pot is optional (set USE_POT 0). The USB-C switch cable turns the whole machine off.</text>
</svg>
